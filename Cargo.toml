[package]
name = "mesopotamia"
version = "0.1.0"
edition = "2024"

[dependencies]
# Trimmed to a 2D + egui app. Dropping Bevy's defaults removes the 3D stack
# (PBR, glTF, lighting), audio, scenes, picking, and bevy_ui — none of which
# this app uses — which roughly halves the wasm. Kept: the full 2D render path,
# winit, web (webgl2), and the input subsystems the camera controls rely on.
bevy = { version = "0.18.1", default-features = false, features = [
    "default_app",     # asset, log, state, window, input_focus, reflect
    "2d_bevy_render",  # sprite + core_pipeline + render + image/color/text/png
    "bevy_winit",
    "default_font",
    "std",
    "multi_threaded",
    "webgl2",
    "x11",
    "wayland",
    "mouse",
    "keyboard",
    "gestures",
    "touch",
] }
bevy_egui = "0.39.1"
rand = "0.9"

# On the web there is no OS RNG; `rand::rng()` (used by the elk systems) needs
# getrandom routed to the browser's crypto. No effect on native builds.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }

[profile.dev.package."*"]
opt-level = 3

# Web builds: shrink the wasm. Bevy wasm is large, and Cloudflare Pages caps
# individual files at 25 MiB — this plus `wasm-opt` keeps us comfortably under.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
