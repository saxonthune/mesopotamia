[package]
name = "luminous-extractor"
version = "0.1.0"
edition = "2021"
description = "Walks Rust source with syn and emits a files-and-functions structure as JSON for the Luminous pipeline."

# Standalone tool crate. Intentionally NOT a member of the game's build:
# syn/walkdir stay out of the wasm dependency tree.
[dependencies]
syn = { version = "2", features = ["full", "visit", "parsing"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
walkdir = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
